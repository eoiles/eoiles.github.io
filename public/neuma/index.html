<!doctype html>
<html lang="zh-CN" data-default-language="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4e9f0">
<title>NEUMA OS — 拟态手机</title>
<meta name="description" content="A tactile personal phone. Nineteen apps, six themes, playful instruments, light studies and expressive sound.">



<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  --bg:#e4e9f0;--sd:#bcc5d2;--sl:#ffffff;--t1:#3b4454;--t2:#5e6878;--line:#d3dae4;--acc:#4458d4;--acct:#4458d4;
  background:var(--bg);color:var(--t1);
  font-family:'Outfit',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  transition:background-color .35s ease,color .35s ease;
}
body.dark{--bg:#2b3039;--sd:#1c1f26;--sl:#3a414e;--t1:#e6e9ef;--t2:#a9b1be;--line:#3a404b}

/* device */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.device{position:relative;flex-shrink:0;width:418px;height:872px;padding:14px;border-radius:62px;background:var(--bg);box-shadow:22px 22px 46px var(--sd),-22px -22px 46px var(--sl);transform-origin:center center;transition:background-color .35s ease,box-shadow .35s ease}
.screen{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:var(--bg);isolation:isolate;box-shadow:inset 2px 2px 6px var(--sd),inset -2px -2px 6px var(--sl);transition:background-color .35s ease}
body.full .device{width:100vw;height:100vh;height:100dvh;padding:0;border-radius:0;box-shadow:none}
body.full .screen{width:100%;height:100%;border-radius:0;box-shadow:none}

/* base controls */
button{font:inherit;color:inherit;background:var(--bg);border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:box-shadow .18s ease,color .18s ease,background-color .3s ease,transform .12s ease,opacity .2s ease}
button:active{transform:scale(.96)}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
svg{display:block;flex-shrink:0}
svg.filled path{fill:currentColor}
svg.wx .a{stroke:var(--acct)}
.nudge{margin-left:4px}.nudge2{margin-left:2px}

/* layout helpers */
.row{display:flex}
.col{display:flex;flex-direction:column}
.between{justify-content:space-between}
.mid{align-items:center}
.cc{display:flex;align-items:center;justify-content:center}
.grow{flex:1 1 auto;min-width:0}
.w100{width:100%}
.t2{color:var(--t2)}
.acc{color:var(--acct)}
.accbg{background:var(--acc)!important;color:#fff!important}
.num{font-variant-numeric:tabular-nums}
.h1{font-size:26px;font-weight:600;line-height:1.15}
.sub{font-size:14px;color:var(--t2)}
.cap{font-size:12px;color:var(--t2)}
.ghost{background:transparent!important}
.ell{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{border-radius:26px;display:flex;flex-direction:column}
.b44,.b48,.b60,.b84{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.b44{width:44px;height:44px}.b48{width:48px;height:48px}.b60{width:60px;height:60px}.b84{width:84px;height:84px}
.dot{display:block;width:6px;height:6px;border-radius:50%}
.dot8{display:block;width:8px;height:8px;border-radius:50%}

/* the material */
.r-l{box-shadow:10px 10px 22px var(--sd),-10px -10px 22px var(--sl)}
.r-m{box-shadow:6px 6px 13px var(--sd),-6px -6px 13px var(--sl)}
.r-s{box-shadow:4px 4px 9px var(--sd),-4px -4px 9px var(--sl)}
.r-xs{box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--sl)}
.i-l{box-shadow:inset 8px 8px 16px var(--sd),inset -8px -8px 16px var(--sl)}
.i-m{box-shadow:inset 5px 5px 10px var(--sd),inset -5px -5px 10px var(--sl)}
.i-s{box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}
.press:active{box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl)!important}

/* segmented, switch, slider */
.seg{height:52px;flex-shrink:0;padding:5px;border-radius:26px;display:flex;gap:6px;box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl)}
.seg button{flex:1 1 0;border-radius:21px;font-size:14px;font-weight:600;color:var(--t2);background:transparent}
.seg button.on{color:var(--acct);background:var(--bg);box-shadow:4px 4px 9px var(--sd),-4px -4px 9px var(--sl)}
.useg{height:54px;padding:5px;border-radius:27px;display:flex;gap:4px;box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl)}
.useg button{width:44px;height:44px;border-radius:50%;font-size:14px;font-weight:600;color:var(--t2);background:transparent}
.useg button.on{color:var(--acct);background:var(--bg);box-shadow:4px 4px 9px var(--sd),-4px -4px 9px var(--sl)}
.switch{position:relative;width:58px;height:32px;border-radius:16px;flex-shrink:0;background:transparent;box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl)}
.switch:active{transform:none}
.switch span{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--bg);box-shadow:2px 2px 5px var(--sd),-2px -2px 5px var(--sl);transition:left .22s cubic-bezier(.3,.7,.3,1),background-color .22s ease}
.switch.on span{left:30px;background:var(--acc)}
.slider{position:relative;height:10px;border-radius:5px;box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl)}
.slider .fill{position:absolute;left:2px;top:2px;height:6px;border-radius:3px;background:var(--acc)}
.slider .knob{position:absolute;top:-7px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--bg);box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--sl);pointer-events:none}
.slider input{position:absolute;left:0;top:-17px;width:100%;height:44px;margin:0;opacity:0;cursor:pointer}
.slider:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:8px}

/* status bar, home bar, overlays */
.status{position:absolute;top:0;left:0;right:0;height:46px;padding:14px 30px 0;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;z-index:6;pointer-events:none}
.status .sic{display:flex;align-items:center;gap:7px}
.batt{width:25px;height:12px;border-radius:4px;padding:2px;display:flex;box-shadow:inset 1px 1px 3px var(--sd),inset -1px -1px 3px var(--sl)}
.batt i{display:block;height:100%;border-radius:2px;background:var(--t1)}
.homebar{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:170px;height:30px;z-index:7;background:transparent;display:flex;align-items:center;justify-content:center}
.homebar:active{transform:translateX(-50%) scale(.95)}
.homebar i{display:block;width:128px;height:5px;border-radius:3px;background:var(--t1);opacity:.55}
.banner{position:absolute;top:10px;left:12px;right:12px;z-index:8;border-radius:26px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);box-shadow:8px 8px 20px var(--sd),-6px -6px 16px var(--sl);animation:drop .38s cubic-bezier(.2,.85,.25,1)}
@keyframes drop{from{transform:translateY(-130%)}to{transform:none}}
.toast{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);z-index:7;padding:13px 20px;border-radius:24px;background:var(--t1);color:var(--bg);font-size:14px;font-weight:500;white-space:nowrap;animation:toast .25s ease}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.dim{position:absolute;inset:0;z-index:20;background:#000;pointer-events:none;transition:opacity .15s linear}

/* home screen */
.home{position:absolute;inset:0;padding:60px 28px 0;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .34s ease}
.home.behind{transform:scale(.94);opacity:.4}
.home::-webkit-scrollbar,.app::-webkit-scrollbar{display:none}
.widgets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;flex-shrink:0}
.widget{position:relative;height:158px;border-radius:30px;padding:16px 18px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;min-width:0}
.wopen{position:absolute;inset:0;border-radius:30px}
.wopen:active{transform:none}
.widget:has(.wopen:active){box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl)}
.apps{margin-top:30px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));justify-items:center;flex-shrink:0}
.appicon{display:flex;flex-direction:column;align-items:center;gap:8px;width:74px;background:transparent}
.appicon:active{transform:none}
.ico{width:62px;height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--acct);background:var(--bg);box-shadow:6px 6px 13px var(--sd),-6px -6px 13px var(--sl);transition:box-shadow .15s ease,background-color .3s ease,color .3s ease}
.appicon:active .ico{box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl)}
.lbl{font-size:12px;font-weight:500}
.pdots{margin-top:auto;display:flex;justify-content:center;gap:7px;padding:24px 0 18px}
.dock{flex-shrink:0;margin:0 -10px 44px;height:94px;border-radius:34px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));justify-items:center;align-items:center;box-shadow:inset 5px 5px 11px var(--sd),inset -5px -5px 11px var(--sl)}
.dock .lbl{display:none}

/* app layer */
.app{position:absolute;inset:0;z-index:3;background:var(--bg);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;animation:appIn .36s cubic-bezier(.2,.85,.25,1) both}
.app.closing{animation:appOut .24s ease-in both;pointer-events:none}
@keyframes appIn{from{transform:scale(.16);opacity:0;border-radius:48px}to{transform:none;opacity:1;border-radius:0}}
@keyframes appOut{from{transform:none;opacity:1}to{transform:scale(.16);opacity:0;border-radius:48px}}
.page{min-height:100%;padding:58px 28px 48px;display:flex;flex-direction:column;gap:26px}

/* app parts */
.disc{width:260px;height:260px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.disc .in{width:208px;height:208px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.disc .rec{position:relative;width:146px;height:146px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.disc .ring{width:100px;height:100px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.label{width:42px;height:42px;border-radius:50%;background:var(--acc);box-shadow:inset 3px 3px 6px rgba(0,0,0,.2),inset -3px -3px 6px rgba(255,255,255,.25)}
.spin{position:absolute;inset:0;border-radius:50%;pointer-events:none;animation:spin 5s linear infinite;animation-play-state:paused}
.spin.on{animation-play-state:running}
.spin i{position:absolute;left:calc(50% - 4px);top:12px;width:8px;height:8px;border-radius:50%;background:var(--t2);opacity:.45}
.spin b{position:absolute;left:calc(50% - 2px);top:30px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
@keyframes spin{to{transform:rotate(360deg)}}
.stat{flex:1 1 0;padding:14px 8px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:7px}
.sico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--acct)}
.pill{width:58px;height:100px;border-radius:29px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.display{flex-shrink:0;padding:20px 26px;border-radius:30px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:6px;overflow:hidden;transition:height .25s ease}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.key{height:66px;border-radius:22px;font-weight:500}
.ftile{padding:12px 4px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{width:36px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent}
.btrack{width:16px;height:92px;padding:2px;border-radius:8px;display:flex;align-items:flex-end}
.btrack span{display:block;width:100%;border-radius:6px;background:var(--acc);transition:height .4s ease,opacity .2s ease}
.wcard{height:186px;flex-shrink:0;padding:22px 24px;border-radius:28px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left}
.chip{display:block;width:46px;height:34px;border-radius:9px}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;width:68px;font-size:13px;color:var(--t2)}
.qa:active{transform:none}
.qa .b60{background:var(--bg);color:var(--t1)}
.qa:active>span:first-child{box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl)!important}
.lockbtn{position:relative;width:176px;height:176px;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.lockbtn:active{transform:none}
.ctile{height:100px;padding:16px 18px;border-radius:26px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}
.srow{height:56px;display:flex;align-items:center;gap:14px}
.sico2{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.swatch{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.swatch span{display:block;width:24px;height:24px;border-radius:50%}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Offline app collection */
.x-page{gap:22px;padding-left:25px;padding-right:25px;padding-bottom:42px;min-height:100%;color:var(--t1)}
.x-heading,.x-toolbar,.x-section-head,.x-month-head,.x-art-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}
.x-heading h1{font-size:31px;line-height:1.2;letter-spacing:-1.1px;font-weight:600;margin:7px 0 6px}
.x-heading p{font-size:13px;line-height:1.5;color:var(--t2);margin:0}
.x-eyebrow{display:block;color:var(--t2);font-size:9px;letter-spacing:1.8px;font-weight:600;line-height:1.5}
.x-caption{font-size:11px;color:var(--t2);line-height:1.5}
.x-icon{display:flex;align-items:center;justify-content:center;flex:none;width:37px;height:37px;border-radius:13px;background:transparent;color:var(--t2)}
.x-icon:hover,.x-chip:hover{background:color-mix(in srgb,var(--t1) 7%,transparent)}
.x-primary-icon{width:46px;height:46px;border-radius:17px;color:var(--acct);background:var(--bg);box-shadow:5px 5px 13px var(--sd),-5px -5px 13px var(--sl)}
.x-primary,.x-secondary,.x-danger{display:inline-flex;justify-content:center;align-items:center;gap:7px;min-height:43px;border-radius:15px;padding:10px 17px;font-size:12px;font-weight:600;line-height:1.5}
.x-primary{background:var(--acc);color:#fff;box-shadow:0 5px 13px color-mix(in srgb,var(--acc) 20%,transparent)}
.x-secondary{background:color-mix(in srgb,var(--t1) 6%,transparent);color:var(--t1)}
.x-danger{background:#aa4154;color:#fff}
.x-wide{width:100%}.x-actions{display:flex;align-items:center;gap:9px}.x-actions>button{flex:1}
.x-text-button{display:flex;align-items:center;gap:4px;background:transparent;color:var(--acct);font-size:12px;white-space:nowrap;min-height:40px}
.x-toolbar{gap:6px}.x-toolbar .x-caption{font-size:9px}.x-toolbar .x-icon{margin-right:-7px}
.x-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:62px 17px 42px}
.x-empty-symbol{display:flex;align-items:center;justify-content:center;width:83px;height:83px;border-radius:28px;background:var(--bg);box-shadow:9px 9px 20px var(--sd),-9px -9px 20px var(--sl);color:var(--acct);margin-bottom:22px}
.x-empty h3{font-size:20px;font-weight:500;letter-spacing:-.4px;margin:7px 0 0}.x-empty p{font-size:13px;line-height:1.75;color:var(--t2);max-width:225px;margin:10px 0}
.x-notes-list{display:flex;flex-direction:column;gap:13px}.x-note-card{display:flex;gap:13px;align-items:center;text-align:left;border-radius:21px;padding:19px 15px;background:var(--bg);box-shadow:5px 5px 13px var(--sd),-4px -4px 11px var(--sl);min-height:116px;width:100%}
.x-note-mark{width:3px;height:43px;border-radius:3px;background:var(--note-color);flex:none}.x-note-card-content{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}.x-note-card strong{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.x-note-preview{display:block;font-size:12px;line-height:1.5;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.x-note-card .x-caption{font-size:10px}.x-note-card>svg{color:var(--t2)}
.x-note-title,.x-note-body{font:inherit;border:0;background:transparent;color:var(--t1);outline:none;width:100%;border-radius:0;box-shadow:none}
.x-note-title{font-size:28px;font-weight:600;letter-spacing:-.8px;padding:6px 0 0;line-height:1.4;min-width:0;margin-top:9px}.x-note-title::placeholder{color:var(--t2);opacity:.6}
.x-note-meta{display:flex;gap:14px;margin-top:-12px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.x-note-body{resize:none;font-size:15px;line-height:1.9;min-height:310px;flex:1;padding:0}.x-note-body::placeholder{color:var(--t2);opacity:.65}.x-note-body:focus-visible,.x-note-title:focus-visible{outline:1px solid color-mix(in srgb,var(--acc) 35%,transparent);outline-offset:7px;border-radius:4px}
.x-note-foot{display:flex;gap:6px;justify-content:center;align-items:center;color:var(--t2);font-size:10px;opacity:.8;padding-top:14px}.x-delete-confirm{padding:14px;border:1px solid color-mix(in srgb,#aa4154 35%,var(--line));border-radius:17px;background:color-mix(in srgb,#aa4154 7%,transparent)}.x-delete-confirm p{font-size:13px;margin:0 0 12px}
.x-chip{font-size:11px;font-weight:500;min-height:34px;padding:6px 13px;border:1px solid var(--line);border-radius:20px;color:var(--acct);background:transparent}
.x-calendar-card{padding:18px 11px 14px;border-radius:25px;box-shadow:6px 6px 17px var(--sd),-5px -5px 15px var(--sl)}
.x-month-head{padding:0 7px 17px}.x-month-head strong{font-size:20px;font-weight:500;letter-spacing:-.5px}.x-month-head>div:first-child{display:flex;flex-direction:column;gap:3px}.x-month-head>div:first-child>span{font-size:11px;color:var(--t2);letter-spacing:1px}.x-month-head .x-actions{gap:3px}.x-month-head .x-icon{width:31px;height:35px}
.x-calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.x-weekday{display:flex;justify-content:center;align-items:center;height:26px;font-size:10px;font-weight:500;color:var(--t2)}.x-day{aspect-ratio:1;min-height:34px;position:relative;display:flex;align-items:center;justify-content:center;border-radius:13px;background:transparent;font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}.x-day.today{color:var(--acct);font-weight:700;background:color-mix(in srgb,var(--acc) 9%,transparent)}.x-day.selected{background:var(--acc);color:#fff;box-shadow:0 4px 11px color-mix(in srgb,var(--acc) 22%,transparent)}.x-day i{width:3px;height:3px;border-radius:50%;position:absolute;bottom:5px;background:currentColor}.x-day:hover:not(.selected){background:color-mix(in srgb,var(--t1) 8%,transparent)}
.x-section-head h2{font-size:16px;letter-spacing:-.3px;font-weight:500;margin:4px 0 0}.x-section-head .x-icon{background:color-mix(in srgb,var(--t1) 5%,transparent);color:var(--acct)}
.x-day-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 6px 13px;gap:9px}.x-empty-sun{color:var(--t2);opacity:.7;margin-bottom:4px}.x-day-empty strong{font-size:14px;font-weight:500}.x-day-empty>span:last-child{font-size:12px;color:var(--t2)}
.x-event-form{padding:18px;border:1px solid var(--line);border-radius:21px;display:flex;flex-direction:column;gap:15px}.x-event-form label{font-size:11px;font-weight:500;display:flex;flex-direction:column;gap:8px;color:var(--t2)}.x-field{border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--t1) 3%,transparent);color:var(--t1);font:inherit;font-size:12px;padding:12px;min-width:0;width:100%;outline:0}.x-field:focus{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 12%,transparent)}.x-field::placeholder{color:var(--t2);opacity:.65}.x-field[type=time]{color-scheme:light dark}

/* Three levels by purpose: raised actions +1, continuous canvas 0, recessed wells -1. */
body{
 --material-raised:5px 5px 12px var(--sd),-5px -5px 12px var(--sl);
 --material-recess:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl);
 --material-pressed:var(--material-recess);--material-deep:var(--material-recess);
 --soft-raised:var(--material-raised);--soft-hover:var(--material-raised);
 --soft-inset:var(--material-recess);--soft-field:var(--material-recess);
 --soft-focus:0 0 7px 1px color-mix(in srgb,var(--acct) 30%,transparent);
}
.r-l,.r-m,.r-s,.r-xs{box-shadow:var(--material-raised)}
.i-l,.i-m,.i-s{box-shadow:var(--material-recess)}
button:is(.r-l,.r-m,.r-s,.r-xs){--rest-shadow:var(--material-raised)}
button:is(.i-l,.i-m,.i-s){--rest-shadow:var(--material-recess)}
.screen{background:var(--bg)}
.wallpaper{opacity:.25}
.wallpaper:before,.wallpaper[data-paper=silk]:before{display:none!important}
.wallpaper>.x-art{opacity:.06!important;filter:grayscale(.7)!important}
.wallpaper[data-paper=silk]>.x-art{opacity:.018!important}
.lockscreen .wallpaper>.x-art{opacity:.10!important}

}

.focus-strip strong{line-height:1.45}.focus-strip small{line-height:1.4}

/* ---------------- sound & feedback ---------------- */
let actx = null;
function tone(freqs, dur, type, gain) {
  if (S.os.sound === 1) { if (navigator.vibrate) navigator.vibrate(120); return; }
  if (S.os.sound !== 0) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach((f) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gain || 0.08, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.2));
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + (dur || 0.2) + 0.02);
      t += (dur || 0.2) * 0.8;
    });
  } catch (e) { /* audio not available */ }
}
let bannerT = null, bannerN = 0, toastT = null, toastN = 0;
function say(text) {

function hoursList(c) {
  const h = new Date().getHours();
  return c.hours.map((x, i) => {
    const hh = (h + i) % 24, night = hh >= 19 || hh < 6;
    let k = x[1];
    if (night && k === 'sun') k = 'moon';
    if (night && k === 'partly') k = 'cloud';
    return { label: i ? pad2(hh) + ':00' : 'Now', full: i ? 'At ' + pad2(hh) + ':00' : 'Right now', t: x[0], k: k };
  });
}
function daysList(c) {
  const d = new Date().getDay();
  return c.days.map((x, i) => { const n = (d + 1 + i) % 7; return { label: WEEK[n].slice(0, 3), full: WEEK[n], t: x[0], k: x[1] }; });
}

/* ---------------- calculator logic ---------------- */
function calcOp(a, op, b) {
  if (op === '+') return a + b;
  if (op === '−') return a - b;
  if (op === '×') return a * b;
  if (op === '÷') return b === 0 ? NaN : a / b;
  return b;
}
function clean(n) {
  if (!isFinite(n)) return 'Error';
  const r = parseFloat(n.toPrecision(10));
  if (Math.abs(r) >= 1e12 || (r !== 0 && Math.abs(r) < 1e-7)) return r.toExponential(4);
  return String(r);
}
function group(str) {
  if (str === 'Error' || str.indexOf('e') !== -1) return str;
  const neg = str.charAt(0) === '-', body = neg ? str.slice(1) : str, parts = body.split('.');
  return (neg ? '−' : '') + parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (parts.length > 1 ? '.' + parts[1] : '');
}
function pressKey(k) {
  const c = S.calc, label = k[0], type = k[1];
  const val = () => { const v = parseFloat(c.cur); return isNaN(v) ? 0 : v; };
  if (type === 'digit') {
    if (c.fresh || c.cur === 'Error') { c.cur = label === '.' ? '0.' : label; c.fresh = false; return; }
    if (label === '.' && c.cur.indexOf('.') !== -1) return;
    if (c.cur.replace(/[-.]/g, '').length >= 12) return;
    c.cur = c.cur === '0' && label !== '.' ? label : c.cur + label;
    return;
  }
  if (type === 'op') {
    let base = val();
    if (c.op !== null && !c.fresh) base = calcOp(c.prev, c.op, base);
    const shown = clean(base);
    c.prev = base; c.op = label; c.fresh = true; c.cur = shown; c.expr = group(shown) + ' ' + label;
    return;
  }
  if (type === 'eq') {
    if (c.op === null) return;
    const b = val(), r = clean(calcOp(c.prev, c.op, b));
    c.expr = group(clean(c.prev)) + ' ' + c.op + ' ' + group(clean(b)) + ' =';
    c.cur = r; c.prev = null; c.op = null; c.fresh = true;
    return;
  }
  if (type === 'clear') { c.cur = '0'; c.prev = null; c.op = null; c.fresh = true; c.expr = ''; return; }
  const v = val();
  let r = v;
  if (type === 'pi') r = Math.PI;
  else if (type === 'neg') r = -v;
  else if (type === 'pct') r = v / 100;
  else if (type === 'sqrt') r = v < 0 ? NaN : Math.sqrt(v);
  else if (type === 'sq') r = v * v;
  else if (type === 'inv') r = v === 0 ? NaN : 1 / v;
  c.cur = clean(r); c.fresh = type !== 'neg';
}
const calcSpec = () => (S.calc.sci ? SCI.concat(BASIC) : BASIC);

/* ---------------- music & timer logic ---------------- */
function musicStep(dir, auto) {
  const m = S.music, n = TRACKS.length;
  let i = (m.i + dir + n) % n;
  if (m.shuffle) { i = Math.floor(Math.random() * (n - 1)); if (i >= m.i) i += 1; }
  m.i = i; m.t = 0;
  if (auto && S.open !== 'music') notify('music', 'Now playing', TRACKS[i].title + ' by ' + TRACKS[i].artist);
}
function musicTick() {
  const m = S.music;
  if (m.t + 1 < TRACKS[m.i].len) { m.t += 1; return; }
  if (m.repeat) m.t = 0; else musicStep(1, true);
}
function timerAdvance(keep) {
  const t = S.timer;
  if (t.mode === 0) t.mode = t.session % 4 === 0 ? 2 : 1;
  else { t.session = t.mode === 2 ? 1 : t.session + 1; t.mode = 0; }
  t.left = timerDuration(t.mode);
  t.running = !!(keep && t.running);
}
function timerTick() {
  const t = S.timer;
  t.left -= 1;
  if (t.left > 0) return;
  const was = t.mode;
  timerAdvance(t.auto);
  notify('focus', 'Focus', was === 0 ? 'Session done. Time for a break.' : 'Break is over. Back to it.');
  if (t.chime) tone([880, 1175, 1320], 0.3);
}

function calcApp() {
  const c = S.calc, spec = calcSpec(), disp = group(c.cur);
  const size = disp.length > 13 ? 32 : disp.length > 9 ? 42 : 60;
  const keys = spec.map((k, i) => {
    const label = k[0], type = k[1], kind = k[2] || 'plain', aria = k[3] || k[0], span = k[4] || 1;
    const active = type === 'op' && c.op === label && c.fresh;
    const color = kind === 'eq' ? 'accbg' : (kind === 'op' || kind === 'fn') ? 'acc' : '';
    let fs = 24;
    if (kind === 'op' || kind === 'eq' || label === '.') fs = 28;
    else if (kind === 'fn') fs = label.length > 1 ? 18 : 22;
    else if (label === '±' || label === '%') fs = 22;
    return '<button class="key ' + (active ? 'i-m' : 'r-m') + ' ' + color + ' press" style="grid-column:span ' + span + ';font-size:' + fs + 'px" data-act="cKey" data-arg="' + i + '" aria-label="' + aria + '">' + label + '</button>';
  }).join('');
  return '<div class="page" style="padding:58px 24px 44px;gap:24px">' + seg(['Basic', 'Scientific'], c.sci ? 1 : 0, 'cMode') +
    '<div class="display i-l" aria-live="polite" style="height:' + (c.sci ? 110 : 170) + 'px"><div class="cap num" style="font-size:18px;min-height:24px;white-space:nowrap">' + esc(c.expr) + '</div>' +

    '<div class="keys">' + keys + '</div>' +

}

let ambientContext=null,ambientGain=null,ambientVoices=[],ambientIndex=-1;
function stopAmbient(){if(ambientGain&&ambientContext){ambientGain.gain.cancelScheduledValues(ambientContext.currentTime);ambientGain.gain.setTargetAtTime(0,ambientContext.currentTime,.18);}const voices=ambientVoices;ambientVoices=[];voices.forEach(o=>{try{o.stop(ambientContext.currentTime+.8);}catch(e){}});ambientIndex=-1;}
function syncAmbient(){
 if(!S.music.playing){stopAmbient();return;}
 try{
   ambientContext=ambientContext||new(window.AudioContext||window.webkitAudioContext)();
   if(ambientContext.state==='suspended')ambientContext.resume().catch(()=>{});
   if(ambientIndex===S.music.i&&ambientGain){ambientGain.gain.setTargetAtTime(S.music.vol/100*.065,ambientContext.currentTime,.15);return;}
   stopAmbient();ambientIndex=S.music.i;
   ambientGain=ambientContext.createGain();ambientGain.gain.setValueAtTime(0,ambientContext.currentTime);ambientGain.gain.linearRampToValueAtTime(S.music.vol/100*.065,ambientContext.currentTime+1.5);ambientGain.connect(ambientContext.destination);
   const chords=[[130.81,196,261.63,329.63],[146.83,220,293.66,349.23],[110,164.81,220,293.66],[174.61,220,261.63,349.23]];
   chords[S.music.i].forEach((freq,i)=>{const o=ambientContext.createOscillator(),g=ambientContext.createGain(),lfo=ambientContext.createOscillator(),lg=ambientContext.createGain();o.type='sine';o.frequency.value=freq;o.detune.value=i%2?3:-3;g.gain.value=.24;lfo.frequency.value=.08+i*.017;lg.gain.value=.12;lfo.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(ambientGain);o.start();lfo.start();ambientVoices.push(o,lfo);});
 }catch(e){S.music.playing=false;say('Audio is unavailable in this browser.');}
}
['mPlay','mNext','mPrev'].forEach(key=>{const old=ACT[key];ACT[key]=(...args)=>{old(...args);syncAmbient();render();};});

function isChinese(){return S.os.language === 'zh-CN';}
function uiLocale(){return isChinese() ? 'zh-CN' : 'en-US';}
function translateText(value){
  if(!isChinese() || typeof value !== 'string')return value;
  const text=value.trim();if(!text)return value;
  const key=text.replace(/\s+/g,' ');
  let translated=ZH_UI[key];
  if(translated === undefined){
    for(const [pattern,format] of ZH_PATTERNS){
      pattern.lastIndex=0;
      if(pattern.test(key)){pattern.lastIndex=0;translated=key.replace(pattern,format);break;}
    }
  }
  if(translated === undefined && key.includes(': ')){
    const split=key.indexOf(': '),head=key.slice(0,split);
    if(ZH_UI[head])translated=ZH_UI[head]+'：'+translateText(key.slice(split+2));
  }
  return translated === undefined ? value : value.slice(0,value.indexOf(text)) + translated + value.slice(value.indexOf(text)+text.length);
}
function localizeUI(root){
  if(!isChinese())return;
  function visit(node){
    if(node.nodeType === 3){node.nodeValue=translateText(node.nodeValue);return;}
    if(node.nodeType === 1){
      if(node.getAttribute('translate') === 'no' || /^(SCRIPT|STYLE|SVG)$/.test(node.tagName))return;
      for(const name of ['aria-label','aria-valuetext','title','placeholder']){
        const value=node.getAttribute(name);if(value !== null)node.setAttribute(name,translateText(value));
      }
      if(/^(INPUT|TEXTAREA)$/.test(node.tagName))return;
    }
    for(const child of node.childNodes || [])visit(child);
  }
  visit(root);
}

    '<span class="ws-handle" style="left:' + (point.x / 3.2).toFixed(3) + '%;top:' + (point.y / 2.38).toFixed(3) + '%" aria-hidden="true"><span class="ws-handle-sun">' + wx('sun', 25, 1.5) + '</span><span class="ws-handle-moon">' + wx('moon', 24, 1.5) + '</span></span><span class="ws-range-left">' + wsHourLabel(hours[0]) + '</span><span class="ws-range-right">' + wsHourLabel(hours[4]) + '</span><span class="ws-drag-cue" aria-hidden="true">' + ic('chevL', 10) + wsText('FOLLOW THE LIGHT', '拨动光影') + ic('chevR', 10) + '</span></div>' +
    '<div class="ws-metrics"><div><span>' + wsText('HIGH / LOW', '最高 / 最低') + '</span><strong>' + wDeg(city.hi) + ' <i>/</i> ' + wDeg(city.lo) + '</strong></div><div><span>' + wsText('WIND', '风速') + '</span><strong>' + (S.weather.unit === 'F' ? Math.round(city.wind * .621) + '<small> mph</small>' : city.wind + '<small> km/h</small>') + '</strong></div><div><span>' + wsText('HUMIDITY', '湿度') + '</span><strong>' + city.hum + '<small> %</small></strong></div></div>' +
    '<div class="ws-hours" role="group" aria-label="' + wsText('Hourly forecast', '逐时预报') + '">' + hours.map((item, i) => '<button type="button" class="ws-hour' + (index === i ? ' selected' : '') + '" data-act="wsHour" data-arg="' + i + '" aria-pressed="' + (index === i) + '" aria-label="' + esc(wsAria(item)) + '"><span>' + wsHourLabel(item) + '</span>' + wx(item.k, 19, 1.6) + '<strong>' + wDeg(item.t) + '</strong></button>').join('') + '</div>' +
    '<div class="ws-cities" role="group" aria-label="' + wsText('Choose a city', '选择城市') + '">' + CITIES.map((item, i) => '<button type="button" data-act="wxCitySelect" data-arg="' + i + '" class="' + (S.weather.city === i ? 'selected' : '') + '" aria-pressed="' + (S.weather.city === i) + '">' + esc(translateText(item.name)) + '</button>').join('') + '</div><div class="ws-foot">' + wsText('Drag the light. Explore the hours.', '拖动光影，轻探每个时刻。') + '</div></div>';
}
function wsPaint() {

APPS.weather.render = wsForecastApp;
ACT.wsHour = value => {
  const index = Number(value); if (!Number.isInteger(index) || index < 0 || index > 4) return;

$screen.addEventListener('pointerdown', event => {
  const root = event.target.closest?.('[data-weather-horizon]');
  if (!root || WS.drag || event.button !== 0 || event.isPrimary === false || S.open !== 'weather' || S.locked || S.overlay) return;

}, true);
$screen.addEventListener('pointermove', event => {
  if (!WS.drag || event.pointerId !== WS.drag.id) return;

  const position = wsPositionAt(event.clientX, event.clientY, WS.drag.root.getBoundingClientRect()); if (position === null) return;

$screen.addEventListener('lostpointercapture', event => { if (WS.drag?.id === event.pointerId) wsEndDrag(event, true); }, true);
$screen.addEventListener('keydown', event => {
  if (!event.target.matches?.('[data-weather-horizon]')) return;
  if (event.key === 'Escape' && WS.drag) { event.preventDefault(); event.stopPropagation(); wsEndDrag(null, true); return; }
  const current = Math.round(wsBound(S.weather.sel));
  const values = { ArrowRight: current + 1, ArrowUp: current + 1, ArrowLeft: current - 1, ArrowDown: current - 1, PageUp: current + 2, PageDown: current - 2, Home: 0, End: 4 };

window.addEventListener('blur', () => wsEndDrag(null, true));

/* A melody dial for live generative audio. Its timeline is a visual session,
   not a seek position in a recorded file. Dragging never starts playback. */
const ttText = (en, zh) => isChinese() ? zh : en;
let ttDrag = null, ttRotation = 0, ttLastTick = -1;
const ttVoiceBases = new WeakMap();
const ttClamp = (value, min, max) => Math.max(min, Math.min(max, value));
function ttProgress() { return ttClamp(S.music.t / TRACKS[S.music.i].len, 0, 1); }
function ttPositionLabel() { return ttText('Session position ', '聆听进度 ') + mmss(S.music.t); }
function ttHint() { return ttText(ttDrag ? 'Release to let the sound settle.' : 'Turn the dial · shape the sound', ttDrag ? '松开拨盘，让声音缓缓落定。' : '转动拨盘，轻调音色'); }
function ttControl(action, icon, label, selected = false, className = '') {
  return '<button type="button" class="tt-control ' + className + (selected ? ' selected' : '') + '" data-act="' + action + '" aria-label="' + label + '"' + (['mLike', 'mShuffle', 'mRepeat'].includes(action) ? ' aria-pressed="' + selected + '"' : '') + '>' + ic(icon, action === 'mPlay' ? 26 : 20, 1.7, action === 'mLike' && selected ? 'filled' : '') + '</button>';
}
function turntableApp() {
  const m = S.music, track = TRACKS[m.i], progress = ttProgress();
  return '<div class="page tt-page" data-key="tt-player"><div class="tt-heading"><div><span class="tt-edition">' + ttText('MELODY DIAL', '旋律拨盘') + '</span><span class="tt-state"><i class="' + (m.playing ? 'on' : '') + '"></i>' + ttText(m.playing ? 'Now playing' : 'Paused', m.playing ? '正在播放' : '已暂停') + '</span></div>' + ttControl('mLike', 'heart', ttText('Like this track', '收藏这段旋律'), m.liked) + '</div>' +
    '<div class="tt-stage"><div class="tt-deck' + (m.playing ? ' playing' : '') + (ttDrag ? ' adjusting' : '') + '" data-key="tt-deck-' + m.i + '" style="--tt-rotation:' + ttRotation + 'deg;--tt-energy:' + (ttDrag?.energy || 0) + '"><div class="tt-well" data-neuma-control="melody" data-turntable tabindex="0" role="slider" aria-label="' + ttText('Melody dial, turn to adjust the listening session', '旋律拨盘，转动调整聆听进度') + '" aria-describedby="tt-dial-hint" aria-valuemin="0" aria-valuemax="' + track.len + '" aria-valuenow="' + Math.round(m.t) + '" aria-valuetext="' + ttPositionLabel() + '">' +
    '<svg class="tt-progress" viewBox="0 0 100 100" aria-hidden="true"><circle class="tt-progress-track" cx="50" cy="50" r="47"/><circle data-tt-progress cx="50" cy="50" r="47" pathLength="100" stroke-dasharray="100" stroke-dashoffset="' + ((1 - progress) * 100).toFixed(3) + '"/></svg><div class="tt-disc" aria-hidden="true"><div class="tt-orbit"><i></i></div><div class="tt-wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div></div></div>' +
    '<div class="tt-track"><div class="tt-times num"><span data-tt-time>' + mmss(m.t) + '</span><span>' + mmss(track.len) + '</span></div><h1>' + esc(track.title) + '</h1><p id="tt-dial-hint" data-tt-hint>' + ttHint() + '</p></div>' +
    '<div class="tt-transport">' + ttControl('mShuffle', 'shuffle', ttText('Shuffle', '随机播放'), m.shuffle) + ttControl('mPrev', 'prev', ttText('Previous track', '上一首')) + ttControl('mPlay', m.playing ? 'pause' : 'play', ttText(m.playing ? 'Pause ambient' : 'Play ambient', m.playing ? '暂停环境音' : '播放环境音'), false, 'tt-play') + ttControl('mNext', 'next', ttText('Next track', '下一首')) + ttControl('mRepeat', 'repeat', ttText('Repeat this track', '循环播放'), m.repeat) + '</div>' +
    '<div class="tt-volume">' + ic('volLow', 18, 1.6) + '<div class="grow">' + slider(m.vol, 100, 'mVol', ttText('Volume', '音量')) + '</div><span class="num">' + m.vol + '%</span></div><p class="tt-caption">' + ttText('Live generated sound · visual progress', '实时生成声音 · 进度仅作视觉展示') + '</p></div>';
}
APPS.music.render = turntableApp;

function ttSample(element, event) {
  const r = element.getBoundingClientRect(), x = (event.clientX - r.left - r.width / 2) / (r.width / 2), y = (event.clientY - r.top - r.height / 2) / (r.height / 2);
  if (!r.width || !r.height || Math.hypot(x, y) < .2 || Math.hypot(x, y) > 1.35) return null;
  return Math.atan2(y, x) * 180 / Math.PI;
}
function ttCaptureVoices() {
  if (!S.music.playing || !ambientContext) return [];
  return ambientVoices.filter((voice, index) => index % 2 === 0 && voice.detune).map(voice => {
    if (!ttVoiceBases.has(voice)) ttVoiceBases.set(voice, voice.detune.value);
    return { voice, base: ttVoiceBases.get(voice) };
  });
}
function ttBend(delta) {
  if (ttDrag) ttDrag.energy = ttClamp(Math.abs(delta) / 24, 0, 1);
  if (!ttDrag || !ambientContext || !S.music.playing) return;
  for (const item of ttDrag.voices) {
    try { item.voice.detune.setTargetAtTime(item.base + ttClamp(delta * 5, -160, 160), ambientContext.currentTime, .035); } catch (_) {}
  }
}
function ttRestoreVoices(drag) {
  if (!ambientContext) return;
  for (const item of drag.voices) {
    try { item.voice.detune.cancelScheduledValues(ambientContext.currentTime); item.voice.detune.setTargetAtTime(item.base, ambientContext.currentTime, .07); } catch (_) {}
  }
}
function ttUpdate() {
  const deck = $screen.querySelector('.tt-deck'), dial = $screen.querySelector('[data-turntable]');
  if (deck) { deck.classList.toggle('adjusting', !!ttDrag); deck.style.setProperty('--tt-rotation', ttRotation + 'deg'); deck.style.setProperty('--tt-energy', ttDrag?.energy || 0); }
  if (dial) { dial.setAttribute('aria-valuenow', Math.round(S.music.t)); dial.setAttribute('aria-valuetext', ttPositionLabel()); }
  const arc = $screen.querySelector('[data-tt-progress]'); if (arc) arc.setAttribute('stroke-dashoffset', ((1 - ttProgress()) * 100).toFixed(3));
  const time = $screen.querySelector('[data-tt-time]'); if (time) time.textContent = mmss(S.music.t);
  const hint = $screen.querySelector('[data-tt-hint]'); if (hint) hint.textContent = ttHint();
}
function ttFinish(event, cancel = false) {
  const drag = ttDrag;
  if (!drag || (event && event.pointerId !== drag.id)) return;

  ttRestoreVoices(drag);
  if (S.music.i === drag.track) {
    S.music.t = cancel ? drag.start : Math.round(drag.value);
    if (cancel) ttRotation = drag.rotation;
  }
  try { if (drag.element.hasPointerCapture(drag.id)) drag.element.releasePointerCapture(drag.id); } catch (_) {}
  if (drag.moved) { suppressClickUntil = Date.now() + 300; controlClickTarget = drag.element; }

  if (S.open === 'music' && !S.overlay && !S.locked && !S.closing) render();
}
$screen.addEventListener('pointerdown', event => {
  const element = event.target.closest?.('[data-turntable]');
  if (!element || ttDrag || event.button !== 0 || S.open !== 'music' || S.overlay || S.locked) return;
  const angle = ttSample(element, event); if (angle === null) return;
  ttDrag = { id: event.pointerId, element, angle, start: S.music.t, value: S.music.t, rotation: ttRotation, track: S.music.i, moved: false, energy: 0, voices: ttCaptureVoices() };
  ttLastTick = Math.floor(S.music.t / 5);
  try { element.setPointerCapture(event.pointerId); } catch (_) {}
  element.focus({ preventScroll: true }); event.preventDefault(); ttUpdate();
});
$screen.addEventListener('pointermove', event => {
  const drag = ttDrag; if (!drag || event.pointerId !== drag.id) return;
  const angle = ttSample(drag.element, event);
  if (angle === null) { drag.angle = null; ttBend(0); ttUpdate(); return; }
  if (drag.angle === null) { drag.angle = angle; return; }
  const delta = ((angle - drag.angle + 540) % 360) - 180; drag.angle = angle;
  const value = ttClamp(drag.value + delta / 6, 0, TRACKS[drag.track].len), change = value - drag.value;
  drag.value = value; drag.moved = drag.moved || Math.abs(change) > .05;
  S.music.t = Math.round(value); ttRotation += change * 6; ttBend(delta);
  const tick = Math.floor(value / 5);
  if (tick !== ttLastTick) { ttLastTick = tick; if (typeof neumaSfx === 'function') neumaSfx('tick', value / TRACKS[drag.track].len); }
  event.preventDefault(); ttUpdate();
}, { passive: false });
$screen.addEventListener('pointerup', event => ttFinish(event));
$screen.addEventListener('pointercancel', event => ttFinish(event, true));
$screen.addEventListener('lostpointercapture', event => ttFinish(event, true));
$screen.addEventListener('keydown', event => {
  if (!event.target.closest?.('[data-turntable]') || !['ArrowLeft', 'ArrowDown', 'ArrowRight', 'ArrowUp', 'Home', 'End'].includes(event.key)) return;
  if (ttDrag) ttFinish(null, true);
  const before = S.music.t, length = TRACKS[S.music.i].len;
  const value = event.key === 'Home' ? 0 : event.key === 'End' ? length : ttClamp(before + (['ArrowRight', 'ArrowUp'].includes(event.key) ? 5 : -5), 0, length);
  ttRotation += (value - before) * 6;

  event.preventDefault(); event.stopPropagation();
});
window.addEventListener('blur', () => ttFinish(null, true));
document.addEventListener('visibilitychange', () => { if (document.hidden) ttFinish(null, true); });
if (typeof MutationObserver === 'function') {
  new MutationObserver(() => {
    if (ttDrag && (S.open !== 'music' || S.overlay || S.locked || S.closing || S.music.i !== ttDrag.track)) ttFinish(null, true);
  }).observe($screen, { childList: true, subtree: true, attributes: true, attributeFilter: ['inert', 'class'] });
}
/* Keep the displayed position under the pointer without stopping its audio. */
const ttMusicTick = musicTick;
musicTick = function () { if (!ttDrag) ttMusicTick(); };
for (const action of ['mPlay', 'mPrev', 'mNext']) {
  const prior = ACT[action];
  ACT[action] = (...args) => { ttFinish(null, true); if (action !== 'mPlay') ttRotation = 0; return prior(...args); };
}

/* Page changes are one continuous track slide, never a second opacity arrival. */
const phoneMotionMedia = typeof window.matchMedia === 'function' ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
const phoneMotionAnimations = new Set();
let phoneMotionFrame = 0, phoneMotionPrevious = null;
function phoneMotionReduced() { return !!(S.os.reduced || phoneMotionMedia?.matches); }
function phoneMotionCancel() {
  for (const animation of phoneMotionAnimations) animation.cancel();
  phoneMotionAnimations.clear();
}
function phoneMotionArrival(elements, distance = 7, startDelay = 0) {
  if (phoneMotionReduced() || document.hidden) return;
  Array.from(elements).slice(0, 6).forEach((element, index) => {
    if (typeof element.animate !== 'function') return;
    const animation = element.animate([
      { opacity: 0, translate: '0 ' + distance + 'px' },
      { opacity: 1, translate: '0 0' }
    ], { duration: 325, delay: startDelay + index * 24, easing: 'cubic-bezier(.18,.76,.24,1)', fill: 'backwards' });
    phoneMotionAnimations.add(animation);
    const release = () => phoneMotionAnimations.delete(animation);
    animation.onfinish = release; animation.oncancel = release;
  });
}
function phoneMotionHomeArrival(distance = 7) {
  const page = $screen.querySelector('.launcher-page:not([inert])');
  if (!page) return;
  const groups = page.querySelectorAll(':scope > .home-hero,:scope > .widgets,:scope > .focus-strip,:scope > .apps,:scope > .page-title,:scope > .search-pill,:scope > .feed-heading,:scope > .feed-card,:scope > .feed-quick,:scope > .library-heading,:scope > .library-title');
  phoneMotionArrival(groups, distance, 35);
}
function phoneMotionSync() {
  phoneMotionFrame = 0;
  const page = $screen.querySelector('.app-body > .page');
  const next = {
    launcher: S.launcher, app: S.open, closing: !!S.closing, locked: S.locked, overlay: S.overlay,
    shadeTab: S.shadeTab, detail: page?.getAttribute('data-key') || '', reduced: phoneMotionReduced(),
    paging: !!$screen.querySelector('.launcher-track.dragging')
  };
  const before = phoneMotionPrevious;
  phoneMotionPrevious = next;
  document.body.classList.toggle('motion-audio-playing', !!S.music.playing);
  document.body.classList.toggle('motion-document-hidden', !!document.hidden);
  if (next.reduced || document.hidden || next.paging) { phoneMotionCancel(); return; }
  if (!before) return;
  const unlocked = before.locked && !next.locked;
  const changedLauncher = before.launcher !== next.launcher;
  const changedDetail = next.app && next.app === before.app && next.detail && next.detail !== before.detail;
  const changedShadeTab = next.overlay === 'shade' && before.overlay === 'shade' && next.shadeTab !== before.shadeTab;
  const changedNavigation = before.app !== next.app || before.closing !== next.closing || before.locked !== next.locked || before.overlay !== next.overlay || before.detail !== next.detail || changedLauncher || changedShadeTab;
  if (changedNavigation) phoneMotionCancel();
  if (!unlocked && !changedDetail && !changedShadeTab) return;
  if (unlocked && !next.app && !next.locked && !next.overlay) phoneMotionHomeArrival(11);
  else if (unlocked && next.app && !next.overlay) phoneMotionArrival($screen.querySelectorAll('.app-header,.app-body'), 9);
  else if (changedDetail && !next.locked && !next.overlay) phoneMotionArrival([page], 5);
  else if (changedShadeTab) phoneMotionArrival($screen.querySelectorAll('.overlay > .cc-grid,.overlay > .cc-volume,.overlay > .cc-play,.overlay > .notification,.overlay > .empty-state'), 5);
}
function phoneMotionSchedule() {
  if (!phoneMotionFrame) phoneMotionFrame = requestAnimationFrame(phoneMotionSync);
}
if (typeof MutationObserver === 'function') {
  const phoneMotionObserver = new MutationObserver(phoneMotionSchedule);
  phoneMotionObserver.observe($screen, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'inert'] });
  phoneMotionObserver.observe(document.body, { attributes: true, attributeFilter: ['class'] });
}
if (phoneMotionMedia?.addEventListener) phoneMotionMedia.addEventListener('change', phoneMotionSchedule);
document.addEventListener('visibilitychange', phoneMotionSchedule);
phoneMotionSchedule();

function carHoldStart() {
  if (holdT || S.open !== 'car') return;
  S.car.holding = true; render();
  holdT = setTimeout(() => {
    holdT = null; S.car.holding = false; S.car.locked = !S.car.locked;
    if (navigator.vibrate && S.os.sound !== 2) navigator.vibrate(40);
    render();
  }, 900);
}
function carHoldEnd() {
  if (!holdT) return;
  clearTimeout(holdT); holdT = null; S.car.holding = false; render();
}

/* ---------------- events ---------------- */
$screen.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || !$screen.contains(el)) return;

$screen.addEventListener('input', (e) => {

$screen.addEventListener('pointerdown', (e) => { if (e.button === 0 && e.target.closest('[data-hold]')) carHoldStart(); });

document.addEventListener('pointercancel', carHoldEnd);
$screen.addEventListener('contextmenu', (e) => { if (e.target.closest('[data-hold]')) e.preventDefault(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return;
  if(S.locked || S.overlay || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (S.open !== 'calc' || S.closing || e.metaKey || e.ctrlKey || e.altKey) return;
  const c = S.calc;
  if (e.key === 'Backspace') {
    e.preventDefault();
    if (!c.fresh && c.cur.length > 1 && c.cur !== 'Error') { c.cur = c.cur.slice(0, -1); if (c.cur === '-' || c.cur === '') c.cur = '0'; }
    else { c.cur = '0'; c.fresh = true; }
    render(); return;
  }
  const map = { '*': '×', 'x': '×', '/': '÷', '-': '−', '+': '+', 'Enter': '=', '=': '=', '.': '.', ',': '.', '%': '%', 'Delete': 'AC', 'c': 'AC', 'C': 'AC' };
  const label = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
  if (!label) return;
  const k = calcSpec().find((s) => s[0] === label);
  if (!k) return;
  e.preventDefault(); pressKey(k); render();
});

/* System clock uses deadlines so a suspended tab does not lose time. */
let lastMinute = hhmm(new Date());
setInterval(systemTick, 1000);
window.addEventListener('resize', fit);
fit();
render();
})();
